name: CI

on:
  push:
    branches: [ main, develop, feat/automated-testing, feature/backend-restructure, tests ]
  pull_request:
    branches: [ main, develop, feat/automated-testing, feature/backend-restructure ]

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      # Ensure the app runs in the Testing environment for integration tests
      ASPNETCORE_ENVIRONMENT: Testing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore Ecommerce.sln

      - name: Build solution
        run: dotnet build Ecommerce.sln --configuration Release --no-restore

      - name: Run Unit Tests
        # Removed --no-build to allow the test runner to resolve binary paths natively
        run: dotnet test tests/Ecommerce.UnitTests/Ecommerce.UnitTests.csproj --configuration Release --logger "trx" --results-directory "TestResults/Unit"

      - name: Run Integration Tests
        # Removed --no-build to allow the test runner to resolve binary paths natively
        run: dotnet test tests/Ecommerce.IntegrationTests/Ecommerce.IntegrationTests.csproj --configuration Release --logger "trx" --results-directory "TestResults/Integration"

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**
