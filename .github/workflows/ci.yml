name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      # Ensure the app runs in the Testing environment for integration tests
      ASPNETCORE_ENVIRONMENT: Testing
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test tests/Ecommerce.UnitTests/Ecommerce.UnitTests.csproj --configuration Release --no-build --logger "trx" --results-directory "TestResults/Unit"

      - name: Run Integration Tests
        run: dotnet test tests/Ecommerce.IntegrationTests/Ecommerce.IntegrationTests.csproj --configuration Release --no-build --logger "trx" --results-directory "TestResults/Integration"

      - name: Publish Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**

      - name: Upload Code Coverage (optional)
        if: false # Set to true if a coverage tool is integrated
        run: echo "Add code coverage upload step here"
