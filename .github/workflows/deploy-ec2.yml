name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore src/Ecommerce.Api/Ecommerce.Api.csproj

      - name: Build
        run: dotnet build src/Ecommerce.Api/Ecommerce.Api.csproj --no-restore -c Release

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:latest

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,nginx/nginx.conf"
          target: "~/ecommerce"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/ecommerce
            
            # Create a .env file for docker compose
            cat << 'EOF' > .env
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            PROD_DB_CONNECTION=${{ secrets.PROD_DB_CONNECTION }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            EOF
            
            # Ensure docker-compose is installed
            if ! command -v docker-compose &> /dev/null && ! sudo docker --help | grep -q "compose"; then
              echo "Installing docker-compose standalone binary..."
              sudo curl -L "https://github.com/docker/compose/releases/download/v2.26.1/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              sudo ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose || true
            fi
            
            # Clean up old standalone container to free up port 80
            sudo docker stop ecommerce-api || true
            sudo docker rm ecommerce-api || true
            
            # Pull the latest images and start containers
            # Fallback to older docker-compose if modern plugin is missing
            if sudo docker --help | grep -q "compose"; then
              sudo docker compose pull
              sudo docker compose up -d --remove-orphans
            else
              sudo docker-compose pull
              sudo docker-compose up -d --remove-orphans
            fi

            # --- DIAGNOSTICS START ---
            echo "Waiting for containers to stabilize..."
            sleep 5
            echo "CONTAINER STATUS:"
            sudo docker ps
            echo "LOCAL CONNECTIVITY TEST:"
            curl -I http://localhost/health || echo "Local health check failed!"
            echo "NGINX ERROR LOGS (Last 20 lines):"
            sudo docker logs ecommerce-nginx-1 --tail 20
            # --- DIAGNOSTICS END ---
