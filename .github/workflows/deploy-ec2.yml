name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore src/Ecommerce.Api/Ecommerce.Api.csproj

      - name: Build
        run: dotnet build src/Ecommerce.Api/Ecommerce.Api.csproj --no-restore -c Release

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:latest

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Pull the latest image
            sudo docker pull ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:latest
            
            # Stop and remove the existing container if it's running
            sudo docker stop ecommerce-api || true
            sudo docker rm ecommerce-api || true
            
            # Run the new container, passing in database and Stripe secrets
            sudo docker run -d \
              --name ecommerce-api \
              -p 80:8080 \
              -e "ConnectionStrings__DefaultConnection=${{ secrets.PROD_DB_CONNECTION }}" \
              -e "StripeSettings__SecretKey=${{ secrets.STRIPE_SECRET_KEY }}" \
              -e "StripeSettings__PublishableKey=${{ secrets.STRIPE_PUBLISHABLE_KEY }}" \
              -e "CloudinarySettings__CloudName=${{ secrets.CLOUDINARY_CLOUD_NAME }}" \
              -e "CloudinarySettings__ApiKey=${{ secrets.CLOUDINARY_API_KEY }}" \
              -e "CloudinarySettings__ApiSecret=${{ secrets.CLOUDINARY_API_SECRET }}" \
              -e "Jwt__Key=${{ secrets.JWT_SECRET_KEY }}" \
              -e "AdminSettings__Email=${{ secrets.ADMIN_EMAIL }}" \
              -e "AdminSettings__Password=${{ secrets.ADMIN_PASSWORD }}" \
              ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:latest
