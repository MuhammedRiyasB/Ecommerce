name: Deploy to EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore Ecommerce.sln

      - name: Build
        run: dotnet build Ecommerce.sln -c Release --no-restore

      - name: Test
        run: dotnet test Ecommerce.sln -c Release --no-build --verbosity normal

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ecommerce-api:latest

      - name: Copy files to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.yml,nginx/nginx.conf"
          target: "~/ecommerce"

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Install Docker if not already installed (required on fresh EC2 instances)
            if ! command -v docker &> /dev/null; then
              echo "Docker not found. Installing Docker..."
              sudo apt-get update -y
              sudo apt-get install -y ca-certificates curl gnupg lsb-release
              sudo install -m 0755 -d /etc/apt/keyrings
              curl -fsSL https://download.docker.com/linux/ubuntu/gpg | sudo gpg --dearmor -o /etc/apt/keyrings/docker.gpg
              sudo chmod a+r /etc/apt/keyrings/docker.gpg
              echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" | sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
              sudo apt-get update -y
              sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              sudo systemctl enable docker
              sudo systemctl start docker
              sudo usermod -aG docker $USER
              echo "Docker installed successfully!"
            else
              echo "Docker is already installed."
            fi

            cd ~/ecommerce
            
            # Create a .env file for docker compose
            cat << 'EOF' > .env
            DOCKER_USERNAME=${{ secrets.DOCKER_USERNAME }}
            PROD_DB_CONNECTION=${{ secrets.PROD_DB_CONNECTION }}
            REDIS_CONNECTION_STRING=${{ secrets.REDIS_CONNECTION_STRING }}
            STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }}
            STRIPE_PUBLISHABLE_KEY=${{ secrets.STRIPE_PUBLISHABLE_KEY }}
            CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}
            CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}
            CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}
            JWT_SECRET_KEY=${{ secrets.JWT_SECRET_KEY }}
            ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
            ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
            TWILIO_ACCOUNT_SID=${{ secrets.TWILIO_ACCOUNT_SID }}
            TWILIO_AUTH_TOKEN=${{ secrets.TWILIO_AUTH_TOKEN }}
            TWILIO_FROM_NUMBER=${{ secrets.TWILIO_FROM_NUMBER }}
            SMTP_HOST=${{ secrets.SMTP_HOST }}
            SMTP_PORT=${{ secrets.SMTP_PORT }}
            SMTP_USERNAME=${{ secrets.SMTP_USERNAME }}
            SMTP_PASSWORD=${{ secrets.SMTP_PASSWORD }}
            SMTP_FROM_ADDRESS=${{ secrets.SMTP_FROM_ADDRESS }}
            FRONTEND_URL=${{ secrets.FRONTEND_URL }}
            EOF
            
            # Ensure docker-compose is installed
            if ! command -v docker-compose &> /dev/null && ! sudo docker --help | grep -q "compose"; then
              echo "Installing docker-compose standalone binary..."
              sudo curl -L "https://github.com/docker/compose/releases/download/v2.26.1/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
              sudo chmod +x /usr/local/bin/docker-compose
              sudo ln -s /usr/local/bin/docker-compose /usr/bin/docker-compose || true
            fi
            
            # Clean up old standalone container to free up port 80
            sudo docker stop ecommerce-api || true
            sudo docker rm ecommerce-api || true

            # --- Free up disk space before pulling new images ---
            # Remove stopped containers, dangling images, unused networks and build cache.
            # This prevents "no space left on device" errors during docker pull.
            echo "=== Disk usage BEFORE cleanup ==="
            df -h /
            sudo docker system prune -f --volumes || true
            sudo docker image prune -af || true
            echo "=== Disk usage AFTER cleanup ==="
            df -h /

            # Pull the latest images and start containers
            if sudo docker compose version &> /dev/null; then
              sudo docker compose pull
              sudo docker compose up -d --remove-orphans
            else
              sudo docker-compose pull
              sudo docker-compose up -d --remove-orphans
            fi

            # Request SSL Certificate if it doesn't exist
            if [ ! -d "./certbot/conf/live/urbaniq.ddns.net" ]; then
              echo "Requesting initial SSL certificate..."
              sudo docker run --rm \
                -v "$(pwd)/certbot/conf:/etc/letsencrypt" \
                -v "$(pwd)/certbot/www:/var/www/certbot" \
                certbot/certbot certonly --webroot -w /var/www/certbot \
                -d urbaniq.ddns.net --email ${{ secrets.ADMIN_EMAIL }} --agree-tos --no-eff-email --non-interactive --keep-until-expiring
            fi
