version: '3.8'

services:
  api:
    image: ${DOCKER_USERNAME}/ecommerce-api:latest
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_FORWARDEDHEADERS_ENABLED=true
      - ConnectionStrings__DefaultConnection=${PROD_DB_CONNECTION}
      - ConnectionStrings__Redis=${REDIS_CONNECTION_STRING}
      - StripeSettings__SecretKey=${STRIPE_SECRET_KEY}
      - StripeSettings__PublishableKey=${STRIPE_PUBLISHABLE_KEY}
      - CloudinarySettings__CloudName=${CLOUDINARY_CLOUD_NAME}
      - CloudinarySettings__ApiKey=${CLOUDINARY_API_KEY}
      - CloudinarySettings__ApiSecret=${CLOUDINARY_API_SECRET}
      - Jwt__Key=${JWT_SECRET_KEY}
      - AdminSettings__Email=${ADMIN_EMAIL}
      - AdminSettings__Password=${ADMIN_PASSWORD}
      - SmsSettings__AccountSid=${TWILIO_ACCOUNT_SID}
      - SmsSettings__AuthToken=${TWILIO_AUTH_TOKEN}
      - SmsSettings__FromNumber=${TWILIO_FROM_NUMBER}
      - EmailSettings__Host=${SMTP_HOST}
      - EmailSettings__Port=${SMTP_PORT}
      - EmailSettings__Username=${SMTP_USERNAME}
      - EmailSettings__Password=${SMTP_PASSWORD}
      - EmailSettings__FromAddress=${SMTP_FROM_ADDRESS}
      - EmailSettings__FrontendUrl=${FRONTEND_URL}

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      - api
